# Overlay for Playwright browser smoke (J-2).
# Forces Demo Mode by clearing provider credentials so FakeProvider is registered.
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentorch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentorch}
      POSTGRES_DB: ${POSTGRES_DB:-agentorch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentorch} -d ${POSTGRES_DB:-agentorch}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://agentorch:${POSTGRES_PASSWORD:-agentorch}@postgres:5432/${POSTGRES_DB:-agentorch}
      DATABASE_SSL_MODE: disable
      AUTH_MODE: header
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      XAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      MISTRAL_API_KEY: ""
      OPENROUTER_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""

volumes:
  postgres-data:

# Render Blueprint - Agent Mesh API/web on Render, with Supabase Postgres/Auth and
# Render Key Value for Redis-compatible ephemeral coordination.
#
# How to deploy:
#   1. Push this repo to GitHub (render.yaml must be at the repo root).
#   2. Configure the sync:false Supabase values when Render prompts for them.
#   3. On Render: New > Blueprint > pick this repo > Apply.
#   4. The app boots in demo mode (simulated AI). For live AI, set OPENAI_API_KEY on the
#      "agent-mesh-api" service (Environment tab) and redeploy.
#
# Notes:
#   - Free web services sleep after ~15 min idle (first request wakes them in ~30-60s).
#   - If the auto-assigned URLs differ from the names below (global name collision),
#     update NEXT_PUBLIC_API_BASE_URL / BACKEND_INTERNAL_URL / CORS_ALLOW_ORIGINS and redeploy.

services:
  # ---- Key Value (Redis-compatible): rate limits, cache, locks ----
  - type: keyvalue
    name: agent-mesh-redis
    plan: free
    ipAllowList: []          # internal only; no public access

  # ---- Backend API (FastAPI) ----
  - type: web
    name: agent-mesh-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # The image's start.sh runs migrations then binds uvicorn to Render's $PORT, so no
    # dockerCommand override is needed (inline shell commands get mangled by Render).
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: AUTH_MODE
        value: supabase
      - key: SEED_AGENTS_ON_STARTUP
        value: "true"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: ARTIFACT_DIR
        value: /tmp/artifacts  # writable on Render's ephemeral filesystem
      - key: DATABASE_URL
        sync: false             # Supabase Direct or Session Pooler URL (server secret)
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-mesh-redis
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: https://agent-mesh-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      # Optional provider keys for live AI (otherwise the app runs in demo mode).
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # ---- Frontend (Next.js) ----
  - type: web
    name: agent-mesh-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Browser-visible API base (baked into the client bundle at build time).
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://agent-mesh-api.onrender.com
      # Server-side base for Next.js server components.
      - key: BACKEND_INTERNAL_URL
        value: https://agent-mesh-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://agent-mesh-web.onrender.com
      # Public Supabase browser values. Render also passes them as Docker build args.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
